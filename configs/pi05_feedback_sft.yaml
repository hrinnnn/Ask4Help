defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: ${oc.env:ASK4HELP_RLINF_PLACEMENT,0-0}

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:FEEDBACK_SFT_OUTPUT}
    project_name: pi05_timing_feedback_ablation
    experiment_name: run
    logger_backends: [tensorboard]
  resume_dir: null
  max_epochs: -1
  max_steps: ${oc.decode:${oc.env:FEEDBACK_SFT_STEPS}}
  val_check_interval: -1
  save_interval: 500

data:
  train_data_paths:
    - dataset_path: ${oc.env:FEEDBACK_ID_DATASET}
      weight: 1.0
    - dataset_path: ${oc.env:FEEDBACK_EXPERT_DATASET}
      weight: 1.0
  openpi_source_balanced: true
  openpi_exclude_padded_action_targets: false
  openpi_mask_padded_action_targets: true
  openpi_valid_action_horizon: 10

awbc:
  enabled: false

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 4
  global_batch_size: 64
  seed: ${oc.decode:${oc.env:FEEDBACK_SFT_SEED}}
  model:
    precision: null
    model_path: ${oc.env:FEEDBACK_BASE_CHECKPOINT}
    model_type: openpi
    num_action_chunks: 10
    action_dim: 8
    is_lora: false
    num_steps: 5
    add_value_head: false
    openpi:
      config_name: pi05_rlt_maniskill_joint
      num_images_in_input: 2
      train_expert_only: true
      detach_critic_input: true
      action_horizon: 10
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      noise_method: flow_sde
      use_rlt: false
    openpi_data:
      repo_id: ${oc.env:FEEDBACK_ID_DATASET}
      default_prompt: ${oc.env:FEEDBACK_TASK_INSTRUCTION}
      norm_stats_path: ${oc.env:FEEDBACK_NORM_PATH}
  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 25
    lr_scheduler: cosine
    num_cycles: 0.5
    min_lr: 2.5e-6
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: false
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false
critic:
  use_critic_model: false
